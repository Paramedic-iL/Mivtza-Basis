<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מבצע בסיס</title>
<link rel="stylesheet" href="style.css?v=ff14">
</head>
<body>
<canvas id="game"></canvas>

<div id="hudTopLeft" class="panel hud-player">
  <img id="portrait" src="assets/sprites/player_portrait.png" alt="">
  <div class="hud-player-stats">
    <div class="row"><span class="lbl">חיים</span><div class="bar"><div id="healthBar"></div></div><span id="health">100</span></div>
    <div class="row bolts" id="ammoBolts" title="יריות"></div>
    <div class="row small">מחסנית <b id="ammo">5</b>/5 · <span id="reloadState">מוכן</span></div>
    <div class="row small">עצורים <b id="arrested">0</b>/<span id="enemyTotal">0</span> · ניקוד <b id="score">0</b></div>
    <div id="reloadBarWrap"><div id="reloadBar"></div></div>
  </div>
</div>

<div id="message" class="panel">טוען...</div>

<div id="winBanner">
  <div id="winBox">כל הכבוד<br>עצרת את כולם</div>
</div>

<div id="hudTopRight" class="hud-right">
  <canvas id="minimap" width="120" height="120"></canvas>
  <div class="hud-right-btns">
    <button id="helpBtn" class="btn blue" type="button">❓ עזרה</button>
    <button id="restart" class="btn yellow" type="button">🔄 משחק חדש</button>
  </div>
</div>

<div id="help" class="panel">
  <b>שליטה</b><br>
  תנועה: WASD / חצים<br>
  ⚡ טייזר: Space<br>
  🔄 טעינה: R<br>
  🤝 מעצר: E<br><br>
  אחרי כל ירייה — טען מחדש.<br>
  5 יריות. כשנגמר — מצא מחסנית צהובה.<br>
  תיבה לבנה עם צלב אדום — ממלאת חיים.<br>
  טייזר מנטרל לשנייה. כדור אויב = ‎-10 חיים.
</div>

<div id="mobile">
  <button class="mobile" id="up" type="button">▲</button>
  <button class="mobile" id="down" type="button">▼</button>
  <button class="mobile" id="left" type="button">◀</button>
  <button class="mobile" id="right" type="button">▶</button>
  <button class="mobile" id="taser" type="button">⚡<br>טייזר</button>
  <button class="mobile" id="arrest" type="button">🤝<br>עצור</button>
  <button class="mobile" id="reload" type="button">R<br>טעינה</button>
</div>

<script src="game.js?v=ff14"></script>
</body>
</html>
